name: Phase 6 authority acceptance metric fix
on:
  push:
    branches: [phase6/release-preview-authority-test]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase6/release-preview-authority-test
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Add authoritative row acceptance diagnostic
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()
          old = """      const previousAuthority = authoritativeElementsRef.current.get(row.id)\n      if (replace || !previousAuthority || isNewerVersion(nextStamp, stampOf(previousAuthority))) authoritativeElementsRef.current.set(row.id, element)\n"""
          new = """      const previousAuthority = authoritativeElementsRef.current.get(row.id)\n      if (replace || !previousAuthority || isNewerVersion(nextStamp, stampOf(previousAuthority))) {\n        authoritativeElementsRef.current.set(row.id, element)\n        // Content-free observability for the exact map preview expiry restores from.\n        // This proves authority was accepted locally without recording element data.\n        canvasDiagnostics.increment('authoritativeRowsAccepted')\n      }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'authority anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx
          git diff --cached --check
          git commit -m "Phase 6: expose authoritative row acceptance metric"
          git push origin HEAD:phase6/release-preview-authority-test
