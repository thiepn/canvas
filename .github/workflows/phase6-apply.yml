name: Phase 6 large-scene integration
on:
  push:
    branches: [phase6/large-scene-indexing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase6/large-scene-indexing
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Integrate indexed scene observation and atomic hydration
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()

          def replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              text = text.replace(old, new, 1)

          replace(
              "import { readRevisionPages } from './revision-sync.ts'\n",
              "import { readRevisionPages } from './revision-sync.ts'\nimport { SceneVersionIndex, indexSceneById } from './scene-index.ts'\n",
              'scene index import',
          )
          replace(
              "  const observedSceneRef = useRef(new Map<string, VersionStamp>())\n",
              "  const observedSceneRef = useRef(new Map<string, VersionStamp>())\n  const sceneVersionIndexRef = useRef(new SceneVersionIndex<SceneElement>())\n",
              'scene index ref',
          )
          replace(
              """    const current = editor.getSceneElementsIncludingDeleted()\n    const replacements = new Map<string, SceneElement | null>()\n    for (const record of records) {\n      const visible = current.find(element => element.id === record.element.id)\n""",
              """    const current = editor.getSceneElementsIncludingDeleted()\n    const currentById = indexSceneById(current)\n    const replacements = new Map<string, SceneElement | null>()\n    for (const record of records) {\n      const visible = currentById.get(record.element.id)\n""",
              'preview restore lookup',
          )
          replace(
              """    applyingRemote.current = true\n    editor.updateScene({ elements: next, captureUpdate: CaptureUpdateAction.NEVER })\n    queueMicrotask(() => { applyingRemote.current = false })\n  }, [])\n\n  const clearRemotePreviews""",
              """    applyingRemote.current = true\n    editor.updateScene({ elements: next, captureUpdate: CaptureUpdateAction.NEVER })\n    sceneVersionIndexRef.current.replace(next, isAllowedElement)\n    queueMicrotask(() => { applyingRemote.current = false })\n  }, [])\n\n  const clearRemotePreviews""",
              'preview restore index refresh',
          )
          replace(
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    queueMicrotask(() => { applyingRemote.current = false })\n    canvasDiagnostics.increment('previewBroadcastsReceived')\n""",
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    sceneVersionIndexRef.current.mark(accepted, isAllowedElement)\n    queueMicrotask(() => { applyingRemote.current = false })\n    canvasDiagnostics.increment('previewBroadcastsReceived')\n""",
              'preview receive index mark',
          )
          replace(
              """    const rows = values.map(normalizeRow).filter((row): row is SyncRow => row !== null)\n    const localElements = replace ? [] : editor.getSceneElementsIncludingDeleted()\n    const remoteElements: SceneElement[] = []\n""",
              """    const rows = values.map(normalizeRow).filter((row): row is SyncRow => row !== null)\n    const localElements = replace ? [] : editor.getSceneElementsIncludingDeleted()\n    const localById = indexSceneById(localElements)\n    const remoteElements: SceneElement[] = []\n""",
              'authoritative local index',
          )
          replace(
              """      observedSceneRef.current.clear()\n      remotePreviewRef.current.clear()\n""",
              """      observedSceneRef.current.clear()\n      sceneVersionIndexRef.current.clear()\n      remotePreviewRef.current.clear()\n""",
              'replace clears scene index',
          )
          replace(
              "const currentLocal = localElements.find(candidate => candidate.id === row.id)",
              "const currentLocal = localById.get(row.id)",
              'authoritative id lookup',
          )
          replace(
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    queueMicrotask(() => { applyingRemote.current = false })\n  }, [])\n\n  const loadAuthoritative""",
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    if (replace) sceneVersionIndexRef.current.replace(reconciled as SceneElement[], isAllowedElement)\n    else sceneVersionIndexRef.current.mark(remoteElements, isAllowedElement)\n    queueMicrotask(() => { applyingRemote.current = false })\n  }, [])\n\n  const loadAuthoritative""",
              'authoritative index refresh',
          )

          old_load = """    const startAfter = mode === 'reconcile' ? reconciliationCursorRef.current : 0\n    let firstPage = true\n    const result = await readRevisionPages<SyncRow>({\n      startAfter,\n      pageSize: ANTI_ENTROPY_PAGE_SIZE,\n      isCurrent,\n      fetchPage: async (afterRevision, limit) => {\n        const { data, error } = await supabase.from(config.tableName)\n          .select('id,version,version_nonce,is_deleted,element,revision')\n          .gt('revision', afterRevision)\n          .order('revision', { ascending: true })\n          .limit(limit)\n          .abortSignal(AbortSignal.timeout(15_000))\n        if (error) throw error\n        return (data ?? []).map(normalizeRow).filter((row): row is SyncRow => row !== null)\n      },\n      onPage: rows => {\n        if (!isCurrent()) return\n        applyRows(rows, mode === 'initial' && firstPage && pendingRef.current.size === 0)\n        firstPage = false\n      },\n    })\n    if (!result.completed || !isCurrent()) return\n    reconciliationCursorRef.current = result.cursor\n"""
          new_load = """    const startAfter = mode === 'reconcile' ? reconciliationCursorRef.current : 0\n    const initialRows: SyncRow[] = []\n    const result = await readRevisionPages<SyncRow>({\n      startAfter,\n      pageSize: ANTI_ENTROPY_PAGE_SIZE,\n      isCurrent,\n      fetchPage: async (afterRevision, limit) => {\n        const { data, error } = await supabase.from(config.tableName)\n          .select('id,version,version_nonce,is_deleted,element,revision')\n          .gt('revision', afterRevision)\n          .order('revision', { ascending: true })\n          .limit(limit)\n          .abortSignal(AbortSignal.timeout(15_000))\n        if (error) throw error\n        return (data ?? []).map(normalizeRow).filter((row): row is SyncRow => row !== null)\n      },\n      onPage: rows => {\n        if (!isCurrent()) return\n        if (mode === 'initial') initialRows.push(...rows)\n        else applyRows(rows, false)\n      },\n    })\n    if (!result.completed || !isCurrent()) return\n    if (mode === 'initial') {\n      applyRows(initialRows, pendingRef.current.size === 0)\n      canvasDiagnostics.gauge('initialHydrationPages', result.pages)\n      canvasDiagnostics.gauge('initialHydrationRows', result.rows)\n      canvasDiagnostics.increment('initialHydrationSceneCommits')\n    }\n    reconciliationCursorRef.current = result.cursor\n"""
          replace(old_load, new_load, 'atomic initial hydration')

          old_onchange = """    const allowed = elements.filter(isAllowedElement)\n    if (allowed.length !== elements.length) {\n      notify('Images, embeds, and file-backed objects are disabled on this canvas.')\n      applyingRemote.current = true\n      apiRef.current?.updateScene({ elements: allowed, captureUpdate: CaptureUpdateAction.NEVER })\n      queueMicrotask(() => { applyingRemote.current = false })\n    }\n    for (const element of allowed) {\n"""
          new_onchange = """    const observationStarted = performance.now()\n    const observation = sceneVersionIndexRef.current.observe(elements, isAllowedElement)\n    canvasDiagnostics.increment('sceneObservationCallbacks')\n    canvasDiagnostics.increment('sceneElementsScanned', observation.scanned)\n    canvasDiagnostics.increment('sceneElementsStampSkipped', observation.skipped)\n    canvasDiagnostics.increment('sceneElementsChanged', observation.changed.length)\n    canvasDiagnostics.sample('sceneObservationMs', performance.now() - observationStarted)\n    if (observation.hasDisallowed) {\n      const allowed = elements.filter(isAllowedElement)\n      notify('Images, embeds, and file-backed objects are disabled on this canvas.')\n      applyingRemote.current = true\n      apiRef.current?.updateScene({ elements: allowed, captureUpdate: CaptureUpdateAction.NEVER })\n      sceneVersionIndexRef.current.replace(allowed, isAllowedElement)\n      queueMicrotask(() => { applyingRemote.current = false })\n    }\n    for (const element of observation.changed) {\n"""
          replace(old_onchange, new_onchange, 'indexed onChange')

          path.write_text(text)

          overlay = Path('app/diagnostics/DiagnosticsOverlay.tsx')
          out = overlay.read_text()
          old = """    <span>Anti-entropy p95 <b>{ms(snapshot, 'antiEntropyMs')}</b></span>\n    <span>Reconcile cursor <b>{number(snapshot.gauges.reconciliationCursor)}</b></span>\n    <span>Reconcile runs / failures <b>{snapshot.counters.antiEntropyRuns ?? 0} / {snapshot.counters.antiEntropyFailures ?? 0}</b></span>\n"""
          new = """    <span>Anti-entropy p95 <b>{ms(snapshot, 'antiEntropyMs')}</b></span>\n    <span>Reconcile cursor <b>{number(snapshot.gauges.reconciliationCursor)}</b></span>\n    <span>Reconcile runs / failures <b>{snapshot.counters.antiEntropyRuns ?? 0} / {snapshot.counters.antiEntropyFailures ?? 0}</b></span>\n    <span>Scene observe p95 <b>{ms(snapshot, 'sceneObservationMs')}</b></span>\n    <span>Scene changed / skipped <b>{snapshot.counters.sceneElementsChanged ?? 0} / {snapshot.counters.sceneElementsStampSkipped ?? 0}</b></span>\n    <span>Hydration pages / commits <b>{number(snapshot.gauges.initialHydrationPages)} / {snapshot.counters.initialHydrationSceneCommits ?? 0}</b></span>\n"""
          if out.count(old) != 1:
              raise SystemExit(f'overlay anchor count={out.count(old)}')
          overlay.write_text(out.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit integrated candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx app/diagnostics/DiagnosticsOverlay.tsx
          git diff --cached --check
          git commit -m "Phase 6: integrate indexed scene processing"
          git push origin HEAD:phase6/large-scene-indexing
