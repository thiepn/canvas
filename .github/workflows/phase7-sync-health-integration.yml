name: Phase 7 sync health integration
on:
  push:
    branches: [phase7/sync-health-ux]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase7/sync-health-ux
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Integrate sync health UX
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()
          replacements = [
            ("import { SceneVersionIndex, indexSceneById } from './scene-index.ts'\nimport { isNewerVersion, shouldKeepPending, type VersionStamp } from './sync-version.ts'",
             "import { SceneVersionIndex, indexSceneById } from './scene-index.ts'\nimport { deriveSyncHealth, recoveryMessage, type CanvasConnectionState, type SaveIssue, type SyncHealth } from './sync-health.ts'\nimport { isNewerVersion, shouldKeepPending, type VersionStamp } from './sync-version.ts'"),
            ("type ConnectionState = 'Connecting' | 'Synchronizing' | 'Live' | 'Reconnecting' | 'Offline' | 'Error'",
             "type ConnectionState = CanvasConnectionState"),
            ("type QueuedPreview = { source: CanvasPreviewSource; elements: SceneElement[] }",
             "type QueuedPreview = { source: CanvasPreviewSource; elements: SceneElement[] }\ntype SyncRuntimeState = { queuedChanges: number; writeInFlight: boolean; localEditing: boolean; saveIssue: SaveIssue }"),
            ("function LiveHeader({ api, identity, people, status, theme, rename, changeTheme }: {\n  api: ExcalidrawImperativeAPI | null\n  identity: Identity\n  people: PresencePerson[]\n  status: ConnectionState\n  theme: ThemePreference",
             "function LiveHeader({ api, identity, people, status, syncHealth, theme, rename, changeTheme }: {\n  api: ExcalidrawImperativeAPI | null\n  identity: Identity\n  people: PresencePerson[]\n  status: ConnectionState\n  syncHealth: SyncHealth\n  theme: ThemePreference"),
            ("    <div role=\"status\" aria-live=\"polite\" className={`connection connection--${status.toLowerCase()}`}><span aria-hidden=\"true\" />{status}</div>",
             "    <div role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" data-sync-health={syncHealth.key} className={`connection sync-health sync-health--${syncHealth.tone}`} aria-label={`${syncHealth.label}. ${syncHealth.detail}`} title={syncHealth.detail}><span aria-hidden=\"true\" /><span>{syncHealth.label}</span></div>"),
            ("  const [status, setStatus] = useState<ConnectionState>('Connecting')\n  const statusRef = useRef<ConnectionState>('Connecting')\n  const [connectionAttempt, setConnectionAttempt] = useState(0)",
             "  const [status, setStatus] = useState<ConnectionState>('Connecting')\n  const statusRef = useRef<ConnectionState>('Connecting')\n  const [syncRuntime, setSyncRuntime] = useState<SyncRuntimeState>({ queuedChanges: 0, writeInFlight: false, localEditing: false, saveIssue: 'none' })\n  const syncRuntimeRef = useRef(syncRuntime)\n  const [connectionAttempt, setConnectionAttempt] = useState(0)"),
            ("  const editingTextRef = useRef<string | null>(null)\n  const operationTracker = useMemo(() => new CanvasOperationTracker<SceneElement>({",
             "  const editingTextRef = useRef<string | null>(null)\n  const patchSyncRuntime = useCallback((patch: Partial<SyncRuntimeState>) => {\n    setSyncRuntime(current => {\n      const next = { ...current, ...patch }\n      syncRuntimeRef.current = next\n      if (next.queuedChanges === current.queuedChanges && next.writeInFlight === current.writeInFlight && next.localEditing === current.localEditing && next.saveIssue === current.saveIssue) return current\n      return next\n    })\n  }, [])\n  const operationTracker = useMemo(() => new CanvasOperationTracker<SceneElement>({"),
            ("      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      durabilityCommitRef.current()\n    },\n  }), [])",
             "      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      patchSyncRuntime({ queuedChanges: durablePendingRef.current.size })\n      durabilityCommitRef.current()\n    },\n  }), [patchSyncRuntime])"),
            ("  const resolvedTheme = theme === 'system' ? systemDark ? 'dark' : 'light' : theme",
             "  const resolvedTheme = theme === 'system' ? systemDark ? 'dark' : 'light' : theme\n  const syncHealth = useMemo(() => deriveSyncHealth({ connection: status, ...syncRuntime }), [status, syncRuntime])\n  const recoveryNotice = recoveryMessage(syncHealth)"),
            ("  const transition = useCallback((next: ConnectionState) => {\n    statusRef.current = next\n    setStatus(next)\n  }, [])",
             "  const transition = useCallback((next: ConnectionState) => {\n    statusRef.current = next\n    setStatus(next)\n    if (next !== 'Live') patchSyncRuntime({ localEditing: false })\n  }, [patchSyncRuntime])"),
            ("    if (!changed) return\n    const reconciled = reconcileElements(",
             "    patchSyncRuntime({ queuedChanges: durablePendingRef.current.size })\n    if (!changed) return\n    const reconciled = reconcileElements("),
            ("  }, [])\n\n  const loadAuthoritative = useCallback",
             "  }, [patchSyncRuntime])\n\n  const loadAuthoritative = useCallback"),
            ("      await loadAuthoritative(() => pageActiveRef.current && statusRef.current === 'Live' && navigator.onLine, 'reconcile')\n      canvasDiagnostics.increment('antiEntropySuccesses')",
             "      await loadAuthoritative(() => pageActiveRef.current && statusRef.current === 'Live' && navigator.onLine, 'reconcile')\n      if (syncRuntimeRef.current.saveIssue === 'unconfirmed' && !writeInFlightRef.current && durablePendingRef.current.size === 0) patchSyncRuntime({ saveIssue: 'none' })\n      canvasDiagnostics.increment('antiEntropySuccesses')"),
            ("  }, [loadAuthoritative])\n\n  const flushDurablePending",
             "  }, [loadAuthoritative, patchSyncRuntime])\n\n  const flushDurablePending"),
            ("    canvasDiagnostics.gauge('durableQueueElements', 0)\n    try {",
             "    canvasDiagnostics.gauge('durableQueueElements', 0)\n    patchSyncRuntime({ queuedChanges: 0, writeInFlight: true })\n    try {"),
            ("        canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n        if (!pageActiveRef.current) return",
             "        canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n        patchSyncRuntime({ queuedChanges: durablePendingRef.current.size, saveIssue: 'retrying' })\n        if (!pageActiveRef.current) return"),
            ("      if (readError) {\n        notify(`Canvas saved, but could not confirm the latest state: ${readError.message}`)\n        return\n      }\n      applyRows(data ?? [])",
             "      if (readError) {\n        patchSyncRuntime({ saveIssue: 'unconfirmed' })\n        notify(`Canvas saved, but could not confirm the latest state: ${readError.message}`)\n        void reconcileAuthoritative()\n        return\n      }\n      applyRows(data ?? [])\n      patchSyncRuntime({ saveIssue: 'none' })"),
            ("      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      if (pageActiveRef.current) {",
             "      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      patchSyncRuntime({ queuedChanges: durablePendingRef.current.size, saveIssue: 'retrying' })\n      if (pageActiveRef.current) {"),
            ("    } finally {\n      writeInFlightRef.current = false\n      if (pageActiveRef.current",
             "    } finally {\n      writeInFlightRef.current = false\n      patchSyncRuntime({ writeInFlight: false, queuedChanges: durablePendingRef.current.size })\n      if (pageActiveRef.current"),
            ("  }, [applyRows, config.tableName, loadAuthoritative, notify, supabase, transition])",
             "  }, [applyRows, config.tableName, loadAuthoritative, notify, patchSyncRuntime, reconcileAuthoritative, supabase, transition])"),
            ("  const clearLongOperationCheckpoint = useCallback(() => {",
             "  const retryConnectionNow = useCallback(() => {\n    if (!navigator.onLine) return\n    retryDelayRef.current = 1200\n    transition('Reconnecting')\n    setConnectionAttempt(value => value + 1)\n  }, [transition])\n\n  const retrySaveNow = useCallback(() => {\n    if (!navigator.onLine || statusRef.current !== 'Live' || writeInFlightRef.current || durablePendingRef.current.size === 0) return\n    if (flushTimer.current) { clearTimeout(flushTimer.current); flushTimer.current = null }\n    void flushDurablePending()\n  }, [flushDurablePending])\n\n  const clearLongOperationCheckpoint = useCallback(() => {"),
            ("          canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n          void flushDurablePending()",
             "          canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n          patchSyncRuntime({ queuedChanges: durablePendingRef.current.size })\n          void flushDurablePending()"),
            ("  }, [clearLongOperationCheckpoint, flushDurablePending, operationTracker])",
             "  }, [clearLongOperationCheckpoint, flushDurablePending, operationTracker, patchSyncRuntime])"),
            ("      operationTracker.beginPointer()\n      armCheckpointRef.current()",
             "      operationTracker.beginPointer()\n      patchSyncRuntime({ localEditing: true })\n      armCheckpointRef.current()"),
            ("      continuousOperationRef.current = null\n      clearCheckpointRef.current()\n      operationTracker.endPointer()",
             "      continuousOperationRef.current = null\n      patchSyncRuntime({ localEditing: false })\n      clearCheckpointRef.current()\n      operationTracker.endPointer()"),
            ("  }, [operationTracker])\n  useEffect(() => {\n    pageActiveRef.current = true",
             "  }, [operationTracker, patchSyncRuntime])\n  useEffect(() => {\n    pageActiveRef.current = true"),
            ("    canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n    continuousOperationRef.current = null",
             "    canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n    patchSyncRuntime({ queuedChanges: durablePendingRef.current.size, localEditing: false })\n    continuousOperationRef.current = null"),
            ("  }, [operationTracker])\n\n  useEffect(() => { identityRef.current = identity }",
             "  }, [operationTracker, patchSyncRuntime])\n\n  useEffect(() => { identityRef.current = identity }"),
            ("      operationTracker.beginText()\n      armCheckpointRef.current()",
             "      operationTracker.beginText()\n      patchSyncRuntime({ localEditing: true })\n      armCheckpointRef.current()"),
            ("      continuousOperationRef.current = null\n      clearCheckpointRef.current()\n      operationTracker.endText()",
             "      continuousOperationRef.current = null\n      patchSyncRuntime({ localEditing: false })\n      clearCheckpointRef.current()\n      operationTracker.endText()"),
            ("  }, [notify, operationTracker, queuePreview])",
             "  }, [notify, operationTracker, patchSyncRuntime, queuePreview])"),
            ("                transition('Live')\n                if (durablePendingRef.current.size) scheduleFlush()",
             "                transition('Live')\n                if (syncRuntimeRef.current.saveIssue === 'unconfirmed' && durablePendingRef.current.size === 0) patchSyncRuntime({ saveIssue: 'none' })\n                if (durablePendingRef.current.size) scheduleFlush()"),
            ("  }, [api, applyRemotePreview, applyRows, clearRemotePreviews, config.tableName, connectionAttempt, identity.deviceId, loadAuthoritative, notify, scheduleFlush, supabase, syncPresence, transition])",
             "  }, [api, applyRemotePreview, applyRows, clearRemotePreviews, config.tableName, connectionAttempt, identity.deviceId, loadAuthoritative, notify, patchSyncRuntime, scheduleFlush, supabase, syncPresence, transition])"),
            ("    <LiveHeader api={api} identity={identity} people={people} status={status} theme={theme} rename={rename} changeTheme={changeTheme} />",
             "    <LiveHeader api={api} identity={identity} people={people} status={status} syncHealth={syncHealth} theme={theme} rename={rename} changeTheme={changeTheme} />"),
            ("      {status !== 'Live' && <div className=\"network-banner\" role=\"status\">{status === 'Error' ? 'Canvas could not synchronize. Retrying automatically; editing remains paused.' : `${status} — editing is paused until the shared canvas is synchronized.`}</div>}\n      {notice && <div className=\"canvas-notice\" role=\"status\">{notice}</div>",
             "      {recoveryNotice && <div className=\"network-banner\"><span>{recoveryNotice}</span>{navigator.onLine && (status === 'Error' || status === 'Reconnecting') && <button type=\"button\" onClick={retryConnectionNow}>Retry now</button>}</div>}\n      {status === 'Live' && (syncHealth.key === 'retrying-save' || syncHealth.key === 'confirming-save') && <div className={`save-health-banner save-health-banner--${syncHealth.tone}`}><span>{syncHealth.detail}</span>{syncHealth.key === 'retrying-save' && <button type=\"button\" onClick={retrySaveNow}>Retry now</button>}</div>}\n      {notice && <div className=\"canvas-notice\" role=\"status\">{notice}</div>"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'editor anchor count={count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          css_path = Path('app/styles/app.css')
          css = css_path.read_text()
          css_replacements = [
            (".connection{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}.connection>span{width:6px;height:6px;border-radius:50%;background:#a57213}.connection--live>span{background:#227b51}.connection--error>span{background:#b43b39}",
             ".connection{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap;max-width:170px}.connection>span[aria-hidden=true]{width:6px;height:6px;flex:none;border-radius:50%;background:#a57213}.sync-health>span:last-child{overflow:hidden;text-overflow:ellipsis}.sync-health--ok>span[aria-hidden=true]{background:#227b51}.sync-health--error>span[aria-hidden=true]{background:#b43b39}.sync-health--offline>span[aria-hidden=true]{background:#777}.sync-health--busy>span[aria-hidden=true]{background:#a57213}"),
            (".network-banner,.canvas-notice,.empty-hint{position:absolute;z-index:400;",
             ".network-banner,.save-health-banner,.canvas-notice,.empty-hint{position:absolute;z-index:400;"),
            (".network-banner{top:68px;max-width:520px;width:calc(100% - 28px)}.canvas-notice{",
             ".network-banner,.save-health-banner{top:68px;max-width:560px;width:calc(100% - 28px);display:flex;align-items:center;justify-content:center;gap:10px}.network-banner button,.save-health-banner button{flex:none;min-height:34px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:3px;padding:5px 10px;font-size:12px}.save-health-banner--error{border-color:#b43b39}.canvas-notice{"),
            (".connection--synchronizing>span,.connection--reconnecting>span,.connection--connecting>span{background:#a57213}.connection--offline>span{background:#777}.live-canvas-app .network-banner{top:16px;pointer-events:none}",
             ".live-canvas-app .network-banner,.live-canvas-app .save-health-banner{top:16px;pointer-events:auto}"),
            ("@media(max-width:700px){.live-excalidraw .App-menu_top{top:4px}.live-canvas-app .network-banner{top:10px}.live-canvas-app .canvas-notice",
             "@media(max-width:700px){.live-excalidraw .App-menu_top{top:4px}.live-canvas-app .network-banner,.live-canvas-app .save-health-banner{top:10px}.live-canvas-app .canvas-notice"),
          ]
          for old, new in css_replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'css anchor count={count}: {old[:100]!r}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx app/styles/app.css
          git diff --cached --check
          git commit -m "Phase 7: integrate sync health and recovery UX"
          git push origin HEAD:phase7/sync-health-ux
