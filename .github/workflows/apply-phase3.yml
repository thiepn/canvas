name: Apply Canvas Phase 3 patch
on:
  push:
    branches: [phase3/durable-mutations]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact reviewed Phase 3 patch
        shell: bash
        env:
          PHASE3_PATCH: ''
        run: |
          printf '%s' "$PHASE3_PATCH" | base64 -d | gzip -d > /tmp/phase3.patch
          git apply --check /tmp/phase3.patch
          git apply /tmp/phase3.patch
          rm .github/workflows/apply-phase3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 3: persist final logical mutations'
          git push origin HEAD:phase3/durable-mutations
