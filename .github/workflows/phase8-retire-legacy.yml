name: Phase 8 production-only migration
on:
  push:
    branches: [phase8/production-only-repo]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase8/production-only-repo
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Correct strict typecheck surface
        run: python scripts/phase8-typecheck-surface.py
      - name: Apply production-only transform
        run: python scripts/phase8-retire-legacy.py
      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install reduced dependency graph
        run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run audit:architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit validated Phase 8 product tree
        run: |
          rm -f scripts/phase8-retire-legacy.py scripts/phase8-typecheck-surface.py
          git checkout -- .github/workflows/ci.yml .github/workflows/phase8-retire-legacy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Phase 8: retire legacy runtime'
          git push origin HEAD:phase8/production-only-repo
