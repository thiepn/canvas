name: Phase 4 support patch applier
on:
  push:
    branches: ['phase4/broadcast-previews']
permissions:
  contents: write
jobs:
  apply-support-patch:
    if: contains(github.event.head_commit.message, 'arm support patch applier')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase4/broadcast-previews
          fetch-depth: 0
      - name: Apply documentation and performance instrumentation
        run: |
          git apply .phase4-support.patch
          rm .phase4-support.patch
          rm .github/workflows/phase4-support-apply.yml
          git diff --check
      - name: Commit support changes and remove patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 4: document and measure preview lane'
          git push origin HEAD:phase4/broadcast-previews
