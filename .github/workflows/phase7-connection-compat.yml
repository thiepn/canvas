name: Phase 7 transport status compatibility
on:
  push:
    branches: [phase7/sync-health-ux]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase7/sync-health-ux
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Keep connection and save health distinct
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()
          old = """    <div role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" data-sync-health={syncHealth.key} className={`connection sync-health sync-health--${syncHealth.tone}`} aria-label={`${syncHealth.label}. ${syncHealth.detail}`} title={syncHealth.detail}><span aria-hidden=\"true\" /><span>{syncHealth.label}</span></div>\n"""
          new = """    <div role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" data-sync-health={syncHealth.key} data-connection-state={status.toLowerCase()} className={`connection sync-health sync-health--${syncHealth.tone}`} aria-label={`${syncHealth.label}. ${syncHealth.detail}${status === 'Live' ? ' Live connection.' : ''}`} title={syncHealth.detail}><span aria-hidden=\"true\" /><span>{syncHealth.label}</span>{status === 'Live' && <span className=\"connection-transport\">Live</span>}</div>\n"""
          if text.count(old) != 1:
              raise SystemExit(f'editor anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          css_path = Path('app/styles/app.css')
          css = css_path.read_text()
          old_css = ".sync-health>span:last-child{overflow:hidden;text-overflow:ellipsis}"
          new_css = ".sync-health>span:nth-child(2){overflow:hidden;text-overflow:ellipsis}.connection-transport{font-size:10px;opacity:.72}.connection-transport::before{content:'·';margin-right:5px}"
          if css.count(old_css) != 1:
              raise SystemExit(f'css anchor count={css.count(old_css)}')
          css_path.write_text(css.replace(old_css, new_css, 1))
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit compatibility
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx app/styles/app.css
          git diff --cached --check
          git commit -m "Phase 7: separate save health from Live transport"
          git push origin HEAD:phase7/sync-health-ux
