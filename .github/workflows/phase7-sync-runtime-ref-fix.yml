name: Phase 7 Saved invariant fix
on:
  push:
    branches: [phase7/sync-health-ux]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase7/sync-health-ux
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Tighten Saved invariants
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()
          replacements = [
            ("""      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      patchSyncRuntime({ queuedChanges: durablePendingRef.current.size })\n      durabilityCommitRef.current()\n""",
             """      canvasDiagnostics.gauge('durableQueueElements', durablePendingRef.current.size)\n      patchSyncRuntime({ queuedChanges: durablePendingRef.current.size, localEditing: false })\n      durabilityCommitRef.current()\n"""),
            ("""    patchSyncRuntime({ queuedChanges: durablePendingRef.current.size })\n    if (!changed) return\n""",
             """    const durableQueueSize = durablePendingRef.current.size\n    patchSyncRuntime({\n      queuedChanges: durableQueueSize,\n      ...(durableQueueSize === 0 && !writeInFlightRef.current && syncRuntimeRef.current.saveIssue === 'retrying' ? { saveIssue: 'none' as const } : {}),\n    })\n    if (!changed) return\n"""),
            ("""      const queued = pendingRef.current.get(element.id)\n      if (!queued || isNewerVersion(nextStamp, stampOf(queued))) pendingRef.current.set(element.id, element)\n    }\n    const activeSnapshot = operationTracker.snapshotActive()\n""",
             """      const queued = pendingRef.current.get(element.id)\n      if (!queued || isNewerVersion(nextStamp, stampOf(queued))) pendingRef.current.set(element.id, element)\n      patchSyncRuntime({ localEditing: true })\n    }\n    const activeSnapshot = operationTracker.snapshotActive()\n"""),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count={count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx
          git diff --cached --check
          git commit -m "Phase 7: enforce exact Saved state"
          git push origin HEAD:phase7/sync-health-ux
