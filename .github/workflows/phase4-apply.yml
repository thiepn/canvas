name: Phase 4 editor patch applier
on:
  push:
    branches: ['phase4/broadcast-previews']
permissions:
  contents: write
jobs:
  apply-editor-patches:
    if: contains(github.event.head_commit.message, 'arm editor patch applier')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase4/broadcast-previews
          fetch-depth: 0
      - name: Apply staged Phase 4 editor hunks
        run: |
          git apply .phase4-editor-1.patch
          git apply .phase4-editor-2.patch
          git apply .phase4-editor-3.patch
          git apply .phase4-editor-4.patch
          rm .phase4-editor-1.patch .phase4-editor-2.patch .phase4-editor-3.patch .phase4-editor-4.patch
          rm .github/workflows/phase4-apply.yml
          git diff --check
      - name: Commit the editor implementation and remove patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 4: wire Supabase Broadcast previews'
          git push origin HEAD:phase4/broadcast-previews
