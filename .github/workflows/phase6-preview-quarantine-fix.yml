name: Phase 6 preview-index quarantine fix
on:
  push:
    branches: [phase6/large-scene-indexing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase6/large-scene-indexing
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Keep quarantined previews out of the scene index
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()

          def replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              text = text.replace(old, new, 1)

          replace(
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    sceneVersionIndexRef.current.mark(accepted, isAllowedElement)\n    queueMicrotask(() => { applyingRemote.current = false })\n""",
              """    applyingRemote.current = true\n    editor.updateScene({ elements: reconciled, captureUpdate: CaptureUpdateAction.NEVER })\n    // Ephemeral previews are intentionally not authoritative scene-index state.\n    // Their delayed onChange callbacks are quarantined below, so the index can\n    // remain anchored to the last local/authoritative immutable version.\n    queueMicrotask(() => { applyingRemote.current = false })\n""",
              'preview index mark',
          )

          replace(
              """            shadowRef.current.set(row.id, nextStamp)\n            continue\n""",
              """            shadowRef.current.set(row.id, nextStamp)\n            sceneVersionIndexRef.current.mark([currentLocal], isAllowedElement)\n            continue\n""",
              'exact authoritative acknowledgement index',
          )

          replace(
              """    const observationStarted = performance.now()\n    const observation = sceneVersionIndexRef.current.observe(elements, isAllowedElement)\n    canvasDiagnostics.increment('sceneObservationCallbacks')\n    canvasDiagnostics.increment('sceneElementsScanned', observation.scanned)\n    canvasDiagnostics.increment('sceneElementsStampSkipped', observation.skipped)\n    canvasDiagnostics.increment('sceneElementsChanged', observation.changed.length)\n""",
              """    const observationStarted = performance.now()\n    const observationNow = Date.now()\n    const observation = sceneVersionIndexRef.current.observe(\n      elements,\n      isAllowedElement,\n      element => (previewEchoStampsRef.current.get(element.id)?.get(previewStampKey(stampOf(element))) ?? 0) > observationNow,\n    )\n    canvasDiagnostics.increment('sceneObservationCallbacks')\n    canvasDiagnostics.increment('sceneElementsScanned', observation.scanned)\n    canvasDiagnostics.increment('sceneElementsStampSkipped', observation.skipped)\n    canvasDiagnostics.increment('sceneElementsChanged', observation.changed.length)\n    if (observation.ignored) {\n      canvasDiagnostics.increment('previewEchoesSuppressed', observation.ignored)\n      canvasDiagnostics.increment('sceneElementsIgnored', observation.ignored)\n    }\n""",
              'preview-safe observation',
          )

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx
          git diff --cached --check
          git commit -m "Phase 6: quarantine preview echoes before indexing"
          git push origin HEAD:phase6/large-scene-indexing
