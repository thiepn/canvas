name: Canvas checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  quality:
    # Both quality and the manual performance workflow mutate canvas_ci_elements.
    # Serialize those jobs across workflows so one run cannot delete another run's fixtures.
    concurrency:
      group: canvas-shared-supabase-ci
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version-matched preinstalled browser runtimes
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium, firefox, webkit } = require('@playwright/test');
          assert.equal(require('@playwright/test/package.json').version, '1.63.0', 'Update the Playwright image and package version together.');
          for (const browser of [chromium, firefox, webkit]) {
            fs.accessSync(browser.executablePath(), fs.constants.X_OK);
            console.log(`${browser.name()}: ${browser.executablePath()}`);
          }
          NODE
      - name: Record source and full dependency audit
        run: |
          mkdir -p artifacts
          # Container and host checkout users differ; trust only this workspace for this command.
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip --output=artifacts/source.zip HEAD
          npm audit --json > artifacts/npm-audit.json || true
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
      - run: npm run check:worker
      - run: npm run build
      - name: Real Excalidraw and Supabase regression gate
        run: npm run test:live
        env:
          HOME: /root
      - name: Preserve live-path browser diagnostics
        if: always()
        run: |
          if [ -d test-results ]; then
            mkdir -p artifacts/live-test-results
            cp -R test-results/. artifacts/live-test-results/
          fi
      - run: npm run test:e2e
        env:
          HOME: /root
      - run: npm run test:production
        env:
          HOME: /root
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canvas-check-results
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
  deploy-pages:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify version-matched deployed-site browser runtime
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          assert.equal(require('@playwright/test/package.json').version, '1.63.0', 'Update the Playwright image and package version together.');
          fs.accessSync(require('@playwright/test').chromium.executablePath(), fs.constants.X_OK);
          NODE
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/canvas/' }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify published bundle, shared connection, reconnect and mobile menu
        run: node scripts/verify-deployed.mjs
        env:
          CANVAS_DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Retain deployed-site verification
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canvas-deployed-verification
          path: artifacts/deployed/
