name: Canvas checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record source and full dependency audit
        shell: bash
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/source.zip HEAD
          npm audit --json > artifacts/npm-audit.json || true
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
      - run: npm run check:worker
      - run: npm run build
      - name: Install browser test runtimes
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real Excalidraw and Supabase regression gate
        run: npm run test:live
      - name: Preserve live-path browser diagnostics
        if: always()
        run: |
          if [ -d test-results ]; then
            mkdir -p artifacts/live-test-results
            cp -R test-results/. artifacts/live-test-results/
          fi
      - run: npm run test:e2e
      - run: npm run test:production
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canvas-check-results
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
  deploy-pages:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/canvas/' }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Install deployed-site browser runtime
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Verify published bundle, shared connection, reconnect and mobile menu
        run: node scripts/verify-deployed.mjs
        env:
          CANVAS_DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Retain deployed-site verification
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canvas-deployed-verification
          path: artifacts/deployed/
