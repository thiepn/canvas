name: Canvas checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Commit refreshed migration lockfile once
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/live-supabase-canvas'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json
            git commit -m 'Refresh lockfile for live Canvas dependencies'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Record full dependency audit
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
      - run: npm run check:worker
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:live
      - run: npm run test:production
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canvas-check-results
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
  deploy-pages:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/canvas/' }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
