name: Refresh lockfile
on:
  push:
    branches: [release/canvas-v1-hardening]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/canvas-v1-hardening
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Refresh exact dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh npm lockfile'
          git push origin HEAD:release/canvas-v1-hardening
