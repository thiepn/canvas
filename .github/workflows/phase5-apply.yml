name: Phase 5 anti-entropy integration
on:
  push:
    branches: [phase5/anti-entropy-reliability]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase5/anti-entropy-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Complete revision-aware authoritative reads
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/canvas/SupabaseCanvasEditor.tsx')
          text = path.read_text()
          old = ".select('id,version,version_nonce,is_deleted,element').in('id', ids)"
          new = ".select('id,version,version_nonce,is_deleted,element,revision').in('id', ids)"
          if text.count(old) != 1:
              raise SystemExit(f'ACK readback anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          if grep -n "select('id,version,version_nonce,is_deleted,element')" app/canvas/SupabaseCanvasEditor.tsx; then
            echo 'Found an authoritative read that still omits revision.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit completed candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/canvas/SupabaseCanvasEditor.tsx
          git diff --cached --check
          git commit -m "Phase 5: make ACK readback revision-aware"
          git push origin HEAD:phase5/anti-entropy-reliability
